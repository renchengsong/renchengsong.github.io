name: Build site

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "templates/**"
      - "assets/**"
      - "scripts/build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python3 scripts/build.py
      - name: 提交生成的页面
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html publications.html resources.html students.html sitemap.xml
          git diff --staged --quiet || git commit -m "build: regenerate pages"
          git push


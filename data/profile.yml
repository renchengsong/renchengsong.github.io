bio: |
  I am a Professor at the School of Instrument Science and Opto-electronics Engineering,
  Hefei University of Technology. 
  
  My research focuses on non-contact intelligent sensing and intelligent signal processing, with an
  emphasis on vision-based sensing, electromagnetic sensing, multimodal fusion, and physics-driven
  deep learning. By exploiting the complementary characteristics of visual and electromagnetic
  modalities, I investigate the non-contact sensing of both the <i>apparent</i> and the
  <i>intrinsic</i> properties of a target. My work centres on two fundamental challenges — response
  modelling and robust perception in complex environments — following a problem-driven paradigm that
  connects theoretical innovation, methodological development and real-world application.

recruiting: |
  I am looking for self-motivated master students interested in non-contact intelligent sensing,
  physics-driven deep learning, or biomedical measurement. Interested candidates are welcome to
  email me a resume.

